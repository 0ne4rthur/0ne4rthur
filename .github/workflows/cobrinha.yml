name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record snake update on main
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/snake-last-run.txt
          git config user.name "Arthur Schimanski"
          git config user.email "94020281+0ne4rthur@users.noreply.github.com"
          git add .github/snake-last-run.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution snake"
          git push origin HEAD:main
